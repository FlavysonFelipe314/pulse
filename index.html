<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #121212;
            color: white;
            overflow-x: hidden;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            width: 230px;
            height: 100vh;
            background: #000;
            padding: 30px 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .logo span {
            color: #1db954;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-item {
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            color: #b3b3b3;
            transition: .2s;
        }

        .menu-item:hover {
            color: white;
            background: #1a1a1a;
        }

        .menu-item.active {
            color: white;
            background: #282828;
        }

        /* MAIN */

        main {
            margin-left: 230px;
            min-height: 100vh;
            padding: 30px 40px;
            background:
                linear-gradient(
                    180deg,
                    #202020 0px,
                    #121212 300px
                );
        }

        /* SEARCH */

        .topbar {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .search-container {
            position: relative;
            width: min(600px, 100%);
        }

        #searchInput {
            width: 100%;
            height: 50px;
            border: none;
            outline: none;
            border-radius: 30px;
            padding: 0 55px 0 22px;
            font-size: 16px;
            background: white;
            color: #111;
        }

        #searchButton {
            position: absolute;
            right: 6px;
            top: 5px;

            width: 40px;
            height: 40px;

            border-radius: 50%;
            border: none;

            background: #1db954;
            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        #searchButton:hover {
            transform: scale(1.05);
        }

        /* HEADER */

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
        }

        .page-header p {
            color: #aaa;
            margin-top: 6px;
        }

        /* VIDEOS GRID */

        .videos {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(210px, 1fr));

            gap: 24px;
        }

        /* CARD */

        .video-card {
            background: #181818;

            padding: 14px;

            border-radius: 10px;

            cursor: pointer;

            transition: all .25s;
        }

        .video-card:hover {
            background: #282828;
            transform: translateY(-5px);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;

            overflow: hidden;

            border-radius: 8px;
        }

        .thumbnail {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: .3s;
        }

        .video-card:hover .thumbnail {
            transform: scale(1.05);
        }

        /* PLAY BUTTON */

        .play-button {
            position: absolute;

            bottom: 10px;
            right: 10px;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            background: #1db954;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;

            opacity: 0;

            transform: translateY(10px);

            transition: .25s;
        }

        .video-card:hover .play-button {
            opacity: 1;
            transform: translateY(0);
        }

        /* INFO */

        .video-info {
            margin-top: 13px;
        }

        .video-title {
            font-size: 15px;
            font-weight: bold;

            line-height: 1.4;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .channel {
            margin-top: 8px;

            color: #a7a7a7;

            font-size: 13px;
        }

        /* LOADING */

        .loading {
            color: #aaa;
            font-size: 18px;
            display: none;
        }

        /* MODAL */

        .modal {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, .88);

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 100;
        }

        .modal-content {
            width: min(900px, 90%);

            background: #181818;

            border-radius: 15px;

            overflow: hidden;

            position: relative;
        }

        .player-container {
            aspect-ratio: 16 / 9;
        }

        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-info {
            padding: 20px;
        }

        .modal-info h2 {
            font-size: 20px;
        }

        .modal-channel {
            color: #aaa;
            margin-top: 8px;
        }

        .close {
            position: absolute;

            top: 10px;
            right: 15px;

            z-index: 101;

            width: 38px;
            height: 38px;

            border: none;

            border-radius: 50%;

            background: #222;

            color: white;

            font-size: 20px;

            cursor: pointer;
        }

        .close:hover {
            background: #333;
        }

        /* RESPONSIVO */

        @media (max-width: 700px) {

            .sidebar {
                display: none;
            }

            main {
                margin-left: 0;
                padding: 20px;
            }

            .videos {
                grid-template-columns:
                    repeat(auto-fill, minmax(160px, 1fr));

                gap: 14px;
            }

        }

    </style>
</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            My<span>Tube</span>
        </div>

        <div class="menu">

            <div class="menu-item active">
                🏠 Início
            </div>

            <div class="menu-item">
                🔍 Pesquisar
            </div>

            <div class="menu-item">
                ❤️ Favoritos
            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main>

        <div class="topbar">

            <div class="search-container">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="O que você quer assistir?"
                >

                <button id="searchButton">
                    🔍
                </button>

            </div>

        </div>


        <div class="page-header">

            <h1 id="pageTitle">
                Pesquise seus vídeos
            </h1>

            <p>
                Encontre vídeos diretamente do YouTube
            </p>

        </div>


        <div id="loading" class="loading">
            Buscando vídeos...
        </div>


        <div
            id="videos"
            class="videos"
        ></div>

    </main>


    <!-- PLAYER MODAL -->

    <div
        id="modal"
        class="modal"
    >

        <div class="modal-content">

            <button
                class="close"
                onclick="closeModal()"
            >
                ✕
            </button>


            <div
                id="player"
                class="player-container"
            ></div>


            <div class="modal-info">

                <h2 id="modalTitle"></h2>

                <div
                    id="modalChannel"
                    class="modal-channel"
                ></div>

            </div>

        </div>

    </div>


<script>

    /*
        SOMENTE PARA TESTE LOCAL.

        Depois vamos mover essa key para o Python
        para ela não ficar visível no navegador.
    */

    const API_KEY = "AIzaSyB-_YaKoylO4UyXmqFf4fNyZ2qeRmwup5c";


    const videosContainer =
        document.getElementById("videos");

    const searchInput =
        document.getElementById("searchInput");

    const searchButton =
        document.getElementById("searchButton");

    const loading =
        document.getElementById("loading");

    const pageTitle =
        document.getElementById("pageTitle");


    /*
        Decodifica entidades HTML.

        Guns N&#39; Roses
        vira
        Guns N' Roses
    */

    function decodeHTML(text) {

        const textarea =
            document.createElement("textarea");

        textarea.innerHTML = text;

        return textarea.value;
    }


    async function searchVideos(query) {

        if (!query.trim()) {
            return;
        }


        loading.style.display = "block";

        videosContainer.innerHTML = "";


        pageTitle.innerText =
            `Resultados para "${query}"`;


        const url =
            "https://www.googleapis.com/youtube/v3/search"
            + "?part=snippet"
            + "&type=video"
            + "&maxResults=20"
            + "&q=" + encodeURIComponent(query)
            + "&key=" + API_KEY;


        try {

            const response =
                await fetch(url);


            const data =
                await response.json();


            if (!response.ok) {

                console.error(data);

                alert(
                    data?.error?.message
                    || "Erro ao buscar vídeos."
                );

                return;
            }


            renderVideos(data.items);


        } catch (error) {

            console.error(error);

            alert(
                "Erro ao conectar com o YouTube."
            );

        } finally {

            loading.style.display = "none";

        }

    }



    function renderVideos(videos) {

        videosContainer.innerHTML = "";


        videos.forEach(video => {

            const videoId =
                video.id?.videoId;


            if (!videoId) {
                return;
            }


            const title =
                decodeHTML(
                    video.snippet.title
                );


            const channel =
                decodeHTML(
                    video.snippet.channelTitle
                );


            const thumbnail =
                video.snippet
                    .thumbnails
                    .high
                    .url;


            const card =
                document.createElement("div");


            card.className =
                "video-card";


            card.innerHTML = `

                <div class="thumbnail-container">

                    <img
                        class="thumbnail"
                        src="${thumbnail}"
                        alt="${title}"
                    >

                    <div class="play-button">
                        ▶
                    </div>

                </div>


                <div class="video-info">

                    <div class="video-title">
                        ${title}
                    </div>

                    <div class="channel">
                        ${channel}
                    </div>

                </div>

            `;


            card.addEventListener(
                "click",
                () => openVideo(
                    videoId,
                    title,
                    channel
                )
            );


            videosContainer.appendChild(
                card
            );

        });

    }



    function openVideo(
        videoId,
        title,
        channel
    ) {

        const modal =
            document.getElementById("modal");


        const player =
            document.getElementById("player");


        player.innerHTML = `

            <iframe
                src="https://www.youtube.com/embed/${videoId}?autoplay=1"
                allow="
                    autoplay;
                    encrypted-media;
                    picture-in-picture
                "
                allowfullscreen
            ></iframe>

        `;


        document.getElementById(
            "modalTitle"
        ).innerText = title;


        document.getElementById(
            "modalChannel"
        ).innerText = channel;


        modal.style.display =
            "flex";

    }



    function closeModal() {

        const modal =
            document.getElementById("modal");


        const player =
            document.getElementById("player");


        modal.style.display =
            "none";


        /*
            Remove iframe para parar o vídeo
        */

        player.innerHTML = "";

    }



    searchButton.addEventListener(
        "click",
        () => {

            searchVideos(
                searchInput.value
            );

        }
    );



    searchInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                searchVideos(
                    searchInput.value
                );

            }

        }
    );



    /*
        Pesquisa inicial
    */

    searchVideos(
        "Guns N Roses"
    );

</script>

</body>
</html>
